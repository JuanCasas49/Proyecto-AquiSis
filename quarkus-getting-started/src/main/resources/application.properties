# -----------------------------------------------------------------------------
# Base de datos - Neon PostgreSQL (credenciales SOLO por variables de entorno)
# Defínalas en el entorno o en un archivo .env (ver .env.example). Nunca las
# escriba en este archivo.
#   DB_URL            jdbc:postgresql://<host>-pooler.<region>.aws.neon.tech/<db>?sslmode=require
#   DB_USER           usuario (p. ej. neondb_owner)
#   DB_PASSWORD       contraseña
#   DB_MIGRATION_URL  (opcional) URL DIRECTA de Neon (sin "-pooler") para las migraciones
# -----------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.jdbc.url=${DB_URL}
%dev.quarkus.datasource.username=${DB_USER}
%dev.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}
# En %test no se define URL: Quarkus levanta un PostgreSQL desechable (Dev Services, requiere Docker).
# Para probar contra una rama de Neon: -Dquarkus.datasource.jdbc.url=... -Dquarkus.datasource.username=... -Dquarkus.datasource.password=...

# Neon suspende el cómputo cuando está inactivo: la primera conexión puede tardar unos segundos
quarkus.datasource.jdbc.min-size=0
quarkus.datasource.jdbc.max-size=8
quarkus.datasource.jdbc.acquisition-timeout=30

# -----------------------------------------------------------------------------
# Migraciones (Flyway): src/main/resources/db/migration
# Reemplazan a hibernate "generation=update": el esquema queda versionado y controlado.
# Si la base ya tiene tablas ajenas a este esquema, baseline-on-migrate evita el error
# "non-empty schema" y aun así ejecuta V1 (baseline-version=0).
# -----------------------------------------------------------------------------
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0
%dev.quarkus.flyway.jdbc-url=${DB_MIGRATION_URL:${DB_URL}}
%dev.quarkus.flyway.username=${DB_USER}
%dev.quarkus.flyway.password=${DB_PASSWORD}
%prod.quarkus.flyway.jdbc-url=${DB_MIGRATION_URL:${DB_URL}}
%prod.quarkus.flyway.username=${DB_USER}
%prod.quarkus.flyway.password=${DB_PASSWORD}

# -----------------------------------------------------------------------------
# Reglas de negocio
# -----------------------------------------------------------------------------
# Días a partir de los cuales un precio reportado se considera desactualizado
app.precios.dias-vigencia=30

# Tamaño máximo del cuerpo HTTP (las fotos viajan en base64, máx. 1 MB reales)
quarkus.http.limits.max-body-size=3M

# -----------------------------------------------------------------------------
# Configuración CORS (Permite peticiones desde Flutter Web / Navegador)
# En producción reemplace * por el dominio real de su cliente web.
# -----------------------------------------------------------------------------
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
